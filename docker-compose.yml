services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: folio_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9002}:80"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: folio_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-folio_app}
      MYSQL_USER: ${DB_USERNAME:-folio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  mysql_data:
  storage_public:
